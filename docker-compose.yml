services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: crud_usuarios
      MYSQL_USER: users_app
      MYSQL_PASSWORD: local_users_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: emisoras-php:local
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: crud_usuarios
      DB_USERNAME: users_app
      DB_PASSWORD: local_users_password
      DB_CHARSET: utf8mb4
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: tls
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CRUD Emisoras}
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
